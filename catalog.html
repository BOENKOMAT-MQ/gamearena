<!DOCTYPE html><html lang="ru" data-bs-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@500;700;800&display=swap" rel="stylesheet"><link rel="icon" href="data:,"><link href="css/style.css?v=3" rel="stylesheet"><title>Каталог мест — GameArena</title></head><body data-page="catalog"><main class="container section"><h1 class="section__title">Каталог игровых мест</h1><div class="row g-4"><aside class="col-lg-3"><form class="panel filters" id="filters"><h2 class="h5">Фильтры</h2>
